name: Wireclaw validation

on:
  push:
    branches: [gate6-wireshark-evidence-bridge, gate8-docker-macos-release, post-v1-embedded-ai-impl]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install packet tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Install Python and web dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[test]'
          npm ci --prefix apps/web
      - name: Regenerate OpenAPI and web contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from wireclaw_api.app import create_app
          with TemporaryDirectory() as directory:
              app = create_app(Path(directory))
              Path('contracts/api.openapi.json').write_text(
                  json.dumps(app.openapi(), indent=2) + '\n', encoding='utf-8'
              )
          PY
          npm run contracts --prefix apps/web
          git diff --exit-code -- contracts/api.openapi.json apps/web/src/generated
      - name: Python validation
        run: |
          command -v tshark
          command -v capinfos
          python -m pytest -q
          ruff check .
          ruff format --check services scripts tests
          python -m compileall -q services scripts tests
          python scripts/validate_gate3.py
      - name: Go validation
        working-directory: services/host-bridge
        run: |
          unformatted="$(gofmt -l *.go)"
          if [ -n "$unformatted" ]; then
            gofmt -d $unformatted
            exit 1
          fi
          go test ./...
          go vet ./...
          go build ./...
      - name: Web validation
        run: |
          npm run lint --prefix apps/web
          npm run format:check --prefix apps/web
          npm run build --prefix apps/web
          npm test --prefix apps/web
      - name: Production browser validation
        run: |
          python scripts/prepare_web_fixtures.py
          npx --prefix apps/web playwright install --with-deps chromium
          npm run test:e2e --prefix apps/web
  bridge-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test and build host bridge
        working-directory: services/host-bridge
        run: |
          go test ./...
          go vet ./...
          go build ./...

  macos-ai-sandbox-qualification:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install packaging test dependency
        run: python -m pip install pytest
      - name: Validate macOS bundle qualification contract
        run: python -m pytest -q tests/packaging/test_macos_ai_bundle.py
      - name: Test and vet WireclawAI lifecycle wrapper
        working-directory: ai/macos/WireclawAI
        run: |
          go test ./...
          go vet ./...
      - name: Run ad-hoc signed App Sandbox isolation qualification
        run: python scripts/qualify_macos_embedded_ai.py
      - name: Record production signing status
        run: |
          echo 'Developer ID and notarization release qualification: NOT_RUN (protected release credentials are not configured in CI)'

  docker-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Python test dependencies
        run: |
          python -m pip install -e '.[test]'
      - name: Validate Compose and launcher contracts
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          python -m pytest -q tests/packaging
      - name: Build and test pinned analyzer image
        run: docker build --target core-test -t wireclaw-core:gate8-test .
      - name: Build production core image and verify release versions
        run: |
          docker build --target core-runtime -t wireclaw-core:gate8 .
          docker run --rm --entrypoint python wireclaw-core:gate8 /opt/wireclaw/verify_analyzer_versions.py
      - name: Exercise the built release image
        env:
          WIRECLAW_TEST_HOST_GATEWAY: '1'
        run: python scripts/validate_container_release.py
