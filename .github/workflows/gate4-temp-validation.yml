name: Gate 4 temporary validation

on:
  push:
    branches:
      - gate4-rules-investigation-report

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test toolchain
        run: python -m pip install -e '.[test]'
      - name: Apply safe Ruff fixes
        run: ruff check . --fix || true
      - name: Apply Ruff formatting
        run: ruff format .
      - name: Verify Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest -q
      - name: Commit formatter changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore: apply Gate 4 validation formatting"
            git push
          fi
