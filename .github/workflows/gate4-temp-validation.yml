name: Gate 4 temporary validation

on:
  push:
    branches:
      - gate4-rules-investigation-report

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packet tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark
          tshark --version
          capinfos --version
      - name: Install test toolchain
        run: python -m pip install -e '.[test]'
      - name: Align Gate 3 integration expectations with Gate 4 lifecycle
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('tests/integration/test_api.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'assert response.json()["state"] == State.INVESTIGATING',
                  'assert response.json()["state"] == State.COMPLETE',
              ),
              (
                  'assert record["state"] == State.INVESTIGATING',
                  'assert record["state"] == State.COMPLETE',
              ),
              (
                  'assert after["state"] == "INVESTIGATING"',
                  'assert after["state"] == "COMPLETE"',
              ),
              (
                  'assert client.post(f"/api/cases/{case_id}/investigate").json()["state"] == "INVESTIGATING"',
                  'assert client.post(f"/api/cases/{case_id}/investigate").json()["state"] == "COMPLETE"',
              ),
              (
                  'assert client.get(f"/api/cases/{second}").json()["state"] == "INVESTIGATING"',
                  'assert client.get(f"/api/cases/{second}").json()["state"] == "COMPLETE"',
              ),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new)

          pattern = r'(?m)^(\s*)"BASELINE_ANALYSIS",\n\1"INVESTIGATING",\n(\s*)\]'
          replacement = (
              r'\1"BASELINE_ANALYSIS",\n'
              r'\1"INVESTIGATING",\n'
              r'\1"ASSEMBLING_REPORT",\n'
              r'\1"COMPLETE",\n'
              r'\2]'
          )
          text, changed = re.subn(pattern, replacement, text, count=2)
          assert changed == 2, changed

          path.write_text(text, encoding='utf-8')
          PY
      - name: Refresh OpenAPI snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wireclaw_api import create_app

          snapshot = create_app(Path('/tmp/wireclaw-openapi-contract')).openapi()
          Path('contracts/api.openapi.json').write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Apply Gate 4 Ruff fixes
        run: >-
          ruff check
          services/api/src/wireclaw_api/app.py
          services/api/src/wireclaw_api/gate4_service.py
          services/api/src/wireclaw_api/investigation.py
          tests/unit/test_investigation.py
          tests/unit/test_investigation_ipv6.py
          tests/integration/test_api.py
          --fix --unsafe-fixes
      - name: Apply Gate 4 Ruff formatting
        run: >-
          ruff format
          services/api/src/wireclaw_api/app.py
          services/api/src/wireclaw_api/gate4_service.py
          services/api/src/wireclaw_api/investigation.py
          tests/unit/test_investigation.py
          tests/unit/test_investigation_ipv6.py
          tests/integration/test_api.py
      - name: Verify static checks
        run: |
          ruff check .
          ruff format --check \
            services/api/src/wireclaw_api/app.py \
            services/api/src/wireclaw_api/gate4_service.py \
            services/api/src/wireclaw_api/investigation.py \
            tests/unit/test_investigation.py \
            tests/unit/test_investigation_ipv6.py \
            tests/integration/test_api.py
          python -m compileall -q services tests
          git diff --check
      - name: Run full tests with real packet tools
        run: pytest -q
      - name: Commit generated, integration, and formatter changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "test: align API lifecycle with Gate 4 completion"
            git push
          fi
