name: Gate 4 temporary validation

on:
  push:
    branches:
      - gate4-rules-investigation-report

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install packet tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tshark
          tshark --version
          capinfos --version
      - name: Install test toolchain
        run: python -m pip install -e '.[test]'
      - name: Refresh OpenAPI snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from wireclaw_api import create_app

          snapshot = create_app(Path('/tmp/wireclaw-openapi-contract')).openapi()
          Path('contracts/api.openapi.json').write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Apply Gate 4 Ruff fixes
        run: >-
          ruff check
          services/api/src/wireclaw_api/app.py
          services/api/src/wireclaw_api/gate4_service.py
          services/api/src/wireclaw_api/investigation.py
          tests/unit/test_investigation.py
          tests/unit/test_investigation_ipv6.py
          tests/integration/test_api.py
          tests/integration/test_gate4_report.py
          tests/integration/test_gate4_golden.py
          --fix --unsafe-fixes
      - name: Apply Gate 4 Ruff formatting
        run: >-
          ruff format
          services/api/src/wireclaw_api/app.py
          services/api/src/wireclaw_api/gate4_service.py
          services/api/src/wireclaw_api/investigation.py
          tests/unit/test_investigation.py
          tests/unit/test_investigation_ipv6.py
          tests/integration/test_api.py
          tests/integration/test_gate4_report.py
          tests/integration/test_gate4_golden.py
      - name: Verify static checks
        run: |
          ruff check .
          ruff format --check \
            services/api/src/wireclaw_api/app.py \
            services/api/src/wireclaw_api/gate4_service.py \
            services/api/src/wireclaw_api/investigation.py \
            tests/unit/test_investigation.py \
            tests/unit/test_investigation_ipv6.py \
            tests/integration/test_api.py \
            tests/integration/test_gate4_report.py \
            tests/integration/test_gate4_golden.py
          python -m compileall -q services tests
          git diff --check
      - name: Run full tests with real packet tools
        run: pytest -q
      - name: Run unit suite count
        run: pytest tests/unit -q
      - name: Run integration suite count with real packet tools
        run: pytest tests/integration -q
      - name: Commit generated and formatter changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore: refresh Gate 4 generated contract and formatting"
            git push
          fi
