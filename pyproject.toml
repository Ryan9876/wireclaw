[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wireclaw-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
wireclaw-analyze = "wireclaw_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["services/analyzer/src"]

[tool.pytest.ini_options]
pythonpath = ["services/analyzer/src", "tests/fixtures"]
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
